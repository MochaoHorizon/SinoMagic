plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    // GeckoLib
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    // Farmer's Delight. Modrinth publishes each file as its own version, so the
    // version segment is the Modrinth version ID -- GbNuOZ4S is 1.21.1-1.3.2.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    // Create 及其前置。只在带 Create 的 run 任务里用到，普通 runClient / runServer 不加载。
    // maven.createmod.net 提供 Ponder 与 Flywheel，Registrate 在另一个仓库
    // （与 Create 自己的 build.gradle 一致）。
    maven {
        name = 'CreateMod'
        url = 'https://maven.createmod.net'
    }
    maven {
        name = 'IThundxr'
        url = 'https://maven.ithundxr.dev/snapshots'
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Access Transformers are auto-detected; uncomment to point at a file explicitly.
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs all registered gametests, then exits.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // 带可选前置（Create 等）的测试运行：工作目录独立为 run-with-create/，
        // 把 jar 放进 run-with-create/mods/ 就只在启动这两个任务时生效，
        // 普通的 runClient / runServer 不受影响。两者共用同一个工作目录，
        // 因此 mods/ 只需准备一份。
        clientWithCreate {
            client()
            gameDirectory = file('run-with-create')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        serverWithCreate {
            server()
            programArgument '--nogui'
            gameDirectory = file('run-with-create')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime

    // 可选前置模组的依赖集合：只解析、不打包。内容会被复制到 run-with-create/mods/。
    optionalMods {
        canBeConsumed = false
        canBeResolved = true
    }
}

// 把 optionalMods 里的 jar 投放到带 Create 的运行目录。只复制不改写，
// 因此手动往那个目录放的东西不会被清掉（不要用 Sync）。
tasks.register('syncOptionalMods', Copy) {
    description = '把可选前置模组复制到 run-with-create/mods'
    from configurations.optionalMods
    into layout.projectDirectory.dir('run-with-create/mods')
    include '*.jar'
}

// 只有这两个 run 任务需要投放
tasks.matching { it.name in ['runClientWithCreate', 'runServerWithCreate'] }.configureEach {
    dependsOn 'syncOptionalMods'
}

dependencies {
    implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.8.3'
    implementation 'maven.modrinth:farmers-delight:GbNuOZ4S'

    // 可选前置（Create 系）。只解析、不参与编译与打包，由 syncOptionalMods 任务
    // 复制到 run-with-create/mods/，因此只对带 Create 的 run 任务生效。
    // Create 的 POM 声明了 Registrate / Ponder / Flywheel，Gradle 会自动解析整套前置。
    optionalMods "com.simibubi.create:create-1.21.1:6.0.11-319"
}

//遇到重复文件，保留最先读取到的，跳过后续重复的
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
